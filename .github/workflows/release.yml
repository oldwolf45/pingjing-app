name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，如 0.2.0"
        required: true

jobs:
  build-windows:
    name: Windows 打包
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 获取版本号
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.version }}") {
            $ver = "${{ github.event.inputs.version }}"
          } elseif ("${{ github.ref_name }}".StartsWith("v")) {
            $ver = "${{ github.ref_name }}".Substring(1)
          } else {
            $ver = "0.0.0"
          }
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "version_name=v$ver" >> $env:GITHUB_OUTPUT

      - name: 更新版本号
        run: python scripts/bump_version.py ${{ steps.version.outputs.version }}

      - name: 安装后端依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 构建前端
        run: cd frontend && npm ci --no-audit --no-fund && npm run build

      - name: 运行测试
        run: python -m pytest backend/tests/ -v --tb=short
        env:
          ZISUYE_MODE: test

      - name: PyInstaller 打包
        run: pyinstaller zisuye.spec --noconfirm --clean

      - name: 打包 zip
        shell: pwsh
        run: |
          $src = "dist/紫苏叶"
          $dst = "dist/紫苏叶策略_${{ steps.version.outputs.version }}_windows_portable.zip"
          Compress-Archive -Path $src -DestinationPath $dst -Force
          echo "zip_path=$dst" >> $env:GITHUB_OUTPUT

      - name: 上传便携版
        uses: actions/upload-artifact@v4
        with:
          name: zisuye-windows-portable
          path: dist/紫苏叶策略_*_windows_portable.zip

      - name: 上传 onedir 目录
        uses: actions/upload-artifact@v4
        with:
          name: zisuye-windows-onedir
          path: dist/紫苏叶/

  release:
    name: 发布 Release
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: 下载 Windows 便携版
        uses: actions/download-artifact@v4
        with:
          name: zisuye-windows-portable
          path: dist/

      - name: 提取更新日志
        id: changelog
        run: |
          # 从 CHANGELOG.md 提取当前版本的内容
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # 找到对应版本的段落
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" ver "\\]") { found=1; next }
            }
            found { print }
          ' CHANGELOG.md > release_notes.md
          
          cat release_notes.md

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.changelog.outputs.version }}
          body_path: release_notes.md
          files: |
            dist/*.zip
          draft: false
          prerelease: false
