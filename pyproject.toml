[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zisuye"
version = "0.2.2"
description = "紫苏叶策略 APP — 基于瓶颈理论的A股选股跟踪系统"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "紫苏叶策略" },
]
keywords = ["stock", "quant", "investment", "value-investing", "python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pywebview>=5.3",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyinstaller>=6.11",
]
alembic = [
    "alembic>=1.13",
    "sqlalchemy>=2.0",
]

[project.scripts]
zisuye = "app.main:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

# algo/ 目录是指纹锁定的核心算法，不做 lint 改动
# tests/ 目录允许更宽松的风格
[tool.ruff.lint.per-file-ignores]
"backend/app/algo/*.py" = ["E402", "F401", "F841", "E731", "E702", "W"]
"backend/tests/*.py" = ["F841", "S101"]
